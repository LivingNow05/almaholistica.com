<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="desc-eje-mente-cuerpo">
  <title id="desc-eje-mente-cuerpo">Diagrama del Eje Mente-Cuerpo y Correlación Neurovegetativa</title>
  <defs>
    <!-- Marcadores de flecha médica para flujo bioeléctrico -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrow-terracotta" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#C25E3E"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2E854B"/>
    </marker>
    <marker id="arrow-lavender" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7C4499"/>
    </marker>
  </defs>

  <!-- Lienzo Sólido Mate Base -->
  <rect width="800" height="600" rx="16" fill="#0A1226" stroke="#1E293B" stroke-width="2"/>

  <!-- Cuadrícula Médica Milimétrica de Precisión -->
  <g stroke="#1E293B" stroke-width="0.75" stroke-dasharray="2 4">
    <line x1="40" y1="80" x2="760" y2="80"/>
    <line x1="40" y1="160" x2="760" y2="160"/>
    <line x1="40" y1="240" x2="760" y2="240"/>
    <line x1="40" y1="320" x2="760" y2="320"/>
    <line x1="40" y1="400" x2="760" y2="400"/>
    <line x1="40" y1="480" x2="760" y2="480"/>
    <line x1="40" y1="540" x2="760" y2="540"/>
    <line x1="160" y1="80" x2="160" y2="540"/>
    <line x1="280" y1="80" x2="280" y2="540"/>
    <line x1="390" y1="80" x2="390" y2="540"/>
    <line x1="510" y1="80" x2="510" y2="540"/>
    <line x1="640" y1="80" x2="640" y2="540"/>
  </g>

  <!-- Encabezado Editorial Clínico -->
  <g id="header-clinical">
    <rect x="40" y="24" width="720" height="44" rx="8" fill="#0E172F" stroke="#1E3A5F" stroke-width="1"/>
    <circle cx="58" cy="46" r="4" fill="#38BDF8"/>
    <text x="74" y="42" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="0.15em">ALMA HOLÍSTICA • INVESTIGACIÓN INTEGRATIVA</text>
    <text x="74" y="56" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">FIGURA I: EJE MENTE - CEREBRO - ÓRGANOS DIANA &amp; CORRELACIÓN NEUROVEGETATIVA</text>
    <rect x="650" y="34" width="96" height="22" rx="11" fill="#060A1A" stroke="#779DD1" stroke-width="1"/>
    <text x="698" y="49" fill="#779DD1" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">ESCALA 1:1</text>
  </g>

  <!-- SECCIÓN IZQUIERDA: SILUETA CRANEAL SAGITAL & DIENCÉFALO -->
  <g id="cranium-sagittal-section" transform="translate(45, 95)">
    <!-- Marco de módulo cerebral -->
    <rect x="0" y="0" width="260" height="430" rx="12" fill="#0E172F" stroke="#1E293B" stroke-width="1.5"/>
    <text x="18" y="26" fill="#779DD1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.1em">I. CORTEZA &amp; DIENCÉFALO</text>
    <text x="18" y="42" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Recepción del choque psicoemocional (DHS)</text>

    <!-- Silueta Sagital Anatómica Vectorial -->
    <path d="M 50 180 
             C 50 110, 90 70, 160 70 
             C 210 70, 235 100, 235 150 
             C 235 180, 220 200, 220 220 
             C 220 235, 230 245, 220 260 
             C 210 270, 190 275, 175 285 
             C 165 295, 160 320, 155 350 
             L 130 350 
             C 125 310, 115 285, 95 275 
             C 75 265, 50 230, 50 180 Z" 
          fill="#060A1A" stroke="#779DD1" stroke-width="1.75"/>

    <!-- Estructura Cerebral Interna: Circunvoluciones Abstractas -->
    <path d="M 85 140 C 110 115, 145 110, 175 125 C 195 135, 205 160, 190 175 C 175 190, 140 180, 120 195 C 100 210, 130 235, 150 245" 
          fill="none" stroke="#1E3A5F" stroke-width="1.5" stroke-dasharray="3 2"/>

    <!-- Tronco Encefálico y Foco de Relé (Diencephalon) -->
    <ellipse cx="148" cy="205" rx="28" ry="20" fill="#0A1226" stroke="#38BDF8" stroke-width="1.5"/>
    
    <!-- Anillos concéntricos de propagación bioeléctrica (Foco Hamer) -->
    <circle cx="148" cy="205" r="8" fill="#38BDF8"/>
    <circle cx="148" cy="205" r="16" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="148" cy="205" r="26" fill="none" stroke="#779DD1" stroke-width="1" stroke-dasharray="4 3"/>
    <circle cx="148" cy="205" r="38" fill="none" stroke="#7C4499" stroke-width="0.8" stroke-dasharray="2 4"/>

    <!-- Nodos neuronales sinápticos -->
    <circle cx="115" cy="130" r="3" fill="#779DD1"/>
    <line x1="115" y1="130" x2="135" y2="155" stroke="#1E3A5F" stroke-width="1"/>
    <circle cx="135" cy="155" r="3" fill="#38BDF8"/>
    <line x1="135" y1="155" x2="148" y2="205" stroke="#38BDF8" stroke-width="1.2"/>
    <circle cx="178" cy="140" r="3" fill="#779DD1"/>
    <line x1="178" y1="140" x2="148" y2="205" stroke="#1E3A5F" stroke-width="1"/>

    <!-- Tarjeta informativa inferior de módulo -->
    <rect x="14" y="325" width="232" height="90" rx="8" fill="#060A1A" stroke="#1E3A5F" stroke-width="1"/>
    <text x="24" y="345" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">MAPEO NEURO-DIENCÉFALO</text>
    <text x="24" y="362" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10">• Corteza: Relaciones &amp; Territorio</text>
    <text x="24" y="378" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10">• Sustancia Blanca: Autoestima</text>
    <text x="24" y="394" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10">• Tronco Cerebral: Supervivencia Básica</text>
  </g>

  <!-- SECCIÓN CENTRAL: EJE NEUROVEGETATIVO Y COLUMNA ESPINAL -->
  <g id="neurovegetative-axis" transform="translate(320, 95)">
    <!-- Marco de Columna Neurovegetativa -->
    <rect x="0" y="0" width="165" height="430" rx="12" fill="#0E172F" stroke="#1E293B" stroke-width="1.5"/>
    <text x="82" y="26" fill="#779DD1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.1em">II. EJE MEDULAR &amp; SNA</text>
    <text x="82" y="42" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Canal bioeléctrico dual</text>

    <!-- Línea media de la médula espinal -->
    <line x1="82" y1="65" x2="82" y2="395" stroke="#1E293B" stroke-width="10" stroke-linecap="round"/>
    <line x1="82" y1="65" x2="82" y2="395" stroke="#334155" stroke-width="2"/>

    <!-- Segmentos vertebrales cervicales, dorsales y lumbares -->
    <!-- C1-C7 -->
    <g id="vertebrae">
      <rect x="71" y="70" width="22" height="6" rx="2" fill="#1E3A5F"/>
      <rect x="71" y="82" width="22" height="6" rx="2" fill="#1E3A5F"/>
      <rect x="71" y="94" width="22" height="6" rx="2" fill="#1E3A5F"/>
      <rect x="71" y="106" width="22" height="6" rx="2" fill="#1E3A5F"/>
      <rect x="71" y="118" width="22" height="6" rx="2" fill="#1E3A5F"/>
      <rect x="71" y="130" width="22" height="6" rx="2" fill="#1E3A5F"/>
      <!-- T1-T12 -->
      <rect x="69" y="150" width="26" height="7" rx="2" fill="#1E3A5F"/>
      <rect x="69" y="164" width="26" height="7" rx="2" fill="#1E3A5F"/>
      <rect x="69" y="178" width="26" height="7" rx="2" fill="#1E3A5F"/>
      <rect x="69" y="192" width="26" height="7" rx="2" fill="#1E3A5F"/>
      <rect x="69" y="206" width="26" height="7" rx="2" fill="#1E3A5F"/>
      <rect x="69" y="220" width="26" height="7" rx="2" fill="#1E3A5F"/>
      <rect x="69" y="234" width="26" height="7" rx="2" fill="#1E3A5F"/>
      <rect x="69" y="248" width="26" height="7" rx="2" fill="#1E3A5F"/>
      <rect x="69" y="262" width="26" height="7" rx="2" fill="#1E3A5F"/>
      <rect x="69" y="276" width="26" height="7" rx="2" fill="#1E3A5F"/>
      <!-- L1-L5 y Sacro -->
      <rect x="67" y="296" width="30" height="8" rx="2" fill="#1E3A5F"/>
      <rect x="67" y="312" width="30" height="8" rx="2" fill="#1E3A5F"/>
      <rect x="67" y="328" width="30" height="8" rx="2" fill="#1E3A5F"/>
      <rect x="67" y="344" width="30" height="8" rx="2" fill="#1E3A5F"/>
      <rect x="67" y="360" width="30" height="8" rx="2" fill="#1E3A5F"/>
      <path d="M 69 375 L 95 375 L 82 400 Z" fill="#1E3A5F"/>
    </g>

    <!-- Vía Simpática (Cadena Ganglionar - Alerta y Lucha) en Terracota -->
    <path d="M 50 75 Q 40 140 45 200 T 40 280 T 48 370" fill="none" stroke="#C25E3E" stroke-width="2"/>
    <circle cx="50" cy="85" r="3.5" fill="#C25E3E"/>
    <circle cx="44" cy="140" r="3.5" fill="#C25E3E"/>
    <circle cx="45" cy="200" r="3.5" fill="#C25E3E"/>
    <circle cx="42" cy="260" r="3.5" fill="#C25E3E"/>
    <circle cx="43" cy="320" r="3.5" fill="#C25E3E"/>
    <circle cx="48" cy="370" r="3.5" fill="#C25E3E"/>

    <!-- Vía Parasimpática / Nervio Vago (Homeostasis y Reparación) en Azul Zafiro & Cyan -->
    <path d="M 115 75 Q 125 150 120 220 T 122 310 T 116 370" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="115" cy="85" r="3.5" fill="#38BDF8"/>
    <circle cx="123" cy="150" r="3.5" fill="#38BDF8"/>
    <circle cx="120" cy="220" r="3.5" fill="#38BDF8"/>
    <circle cx="122" cy="285" r="3.5" fill="#38BDF8"/>
    <circle cx="118" cy="340" r="3.5" fill="#38BDF8"/>
    <circle cx="116" cy="370" r="3.5" fill="#38BDF8"/>

    <!-- Conexiones cruzadas sinápticas medulares -->
    <line x1="50" y1="140" x2="115" y2="140" stroke="#779DD1" stroke-width="0.75" stroke-dasharray="2 2"/>
    <line x1="45" y1="200" x2="120" y2="200" stroke="#779DD1" stroke-width="0.75" stroke-dasharray="2 2"/>
    <line x1="42" y1="260" x2="122" y2="260" stroke="#779DD1" stroke-width="0.75" stroke-dasharray="2 2"/>
    <line x1="43" y1="320" x2="118" y2="320" stroke="#779DD1" stroke-width="0.75" stroke-dasharray="2 2"/>

    <!-- Rótulos de Polaridad Neurovegetativa -->
    <text x="32" y="416" fill="#C25E3E" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700">SIMPÁTICO</text>
    <text x="132" y="416" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" text-anchor="end">VAGO</text>
  </g>

  <!-- CANALES DE CONEXIÓN BIOELÉCTRICA CEREBRO -> MÉDULA -->
  <g id="cerebral-medular-bridge">
    <path d="M 280 230 C 300 230, 305 180, 320 180" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow-cyan)"/>
    <path d="M 280 260 C 300 260, 305 280, 320 280" fill="none" stroke="#C25E3E" stroke-width="1.5" marker-end="url(#arrow-terracotta)"/>
  </g>

  <!-- SECCIÓN DERECHA: ÓRGANOS DIANA SOMÁTICOS (4 FAMILIAS BIOLÓGICAS) -->
  <g id="somatic-target-organs" transform="translate(500, 95)">
    <!-- Marco Contenedor General -->
    <rect x="0" y="0" width="260" height="430" rx="12" fill="#0E172F" stroke="#1E293B" stroke-width="1.5"/>
    <text x="18" y="26" fill="#779DD1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.1em">III. ÓRGANOS DIANA</text>
    <text x="18" y="42" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Manifestación somática por tejido</text>

    <!-- Módulo 1: Respiratorio (Zafiro / Celeste) -->
    <g transform="translate(14, 52)">
      <rect x="0" y="0" width="232" height="78" rx="8" fill="#060A1A" stroke="#2B74AA" stroke-width="1.2"/>
      <circle cx="20" cy="22" r="7" fill="#2B74AA"/>
      <!-- Icono Pulmón Abstracto -->
      <path d="M 17 22 C 17 18 23 18 23 22 C 23 26 17 26 17 22 Z" fill="#F8FAFC"/>
      <text x="34" y="24" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">SISTEMA RESPIRATORIO</text>
      <text x="34" y="40" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Capa: Ectodermo / Endodermo</text>
      <text x="34" y="54" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Conflicto: Amenaza territorial, miedo a morir</text>
      <text x="34" y="68" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="8.5">Patologías: Asma, bronquitis, disnea</text>
    </g>

    <!-- Módulo 2: Digestivo (Verde Salvia) -->
    <g transform="translate(14, 142)">
      <rect x="0" y="0" width="232" height="78" rx="8" fill="#060A1A" stroke="#2E854B" stroke-width="1.2"/>
      <circle cx="20" cy="22" r="7" fill="#2E854B"/>
      <!-- Icono Estómago Abstracto -->
      <path d="M 16 19 C 20 17 24 20 23 25 C 22 27 18 26 16 19 Z" fill="#F8FAFC"/>
      <text x="34" y="24" fill="#2E854B" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">SISTEMA DIGESTIVO</text>
      <text x="34" y="40" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Capa: Endodermo arcaico</text>
      <text x="34" y="54" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Conflicto: Bocado indigerible, contrariedad</text>
      <text x="34" y="68" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="8.5">Patologías: Gastritis, colon irritable, reflujo</text>
    </g>

    <!-- Módulo 3: Osteoarticular (Terracota) -->
    <g transform="translate(14, 232)">
      <rect x="0" y="0" width="232" height="78" rx="8" fill="#060A1A" stroke="#C25E3E" stroke-width="1.2"/>
      <circle cx="20" cy="22" r="7" fill="#C25E3E"/>
      <!-- Icono Vértebra / Articulación Abstracta -->
      <circle cx="20" cy="22" r="3.5" fill="#F8FAFC"/>
      <text x="34" y="24" fill="#C25E3E" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">SISTEMA OSTEOARTICULAR</text>
      <text x="34" y="40" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Capa: Mesodermo nuevo</text>
      <text x="34" y="54" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Conflicto: Desvalorización, pérdida de aptitud</text>
      <text x="34" y="68" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="8.5">Patologías: Lumbalgia, ciática, fibromialgia</text>
    </g>

    <!-- Módulo 4: Nervioso / Cutáneo (Amatista) -->
    <g transform="translate(14, 322)">
      <rect x="0" y="0" width="232" height="92" rx="8" fill="#060A1A" stroke="#7C4499" stroke-width="1.2"/>
      <circle cx="20" cy="22" r="7" fill="#7C4499"/>
      <!-- Icono Sinapsis / Red Abstracta -->
      <path d="M 16 22 L 20 18 L 24 22 L 20 26 Z" fill="#F8FAFC"/>
      <text x="34" y="24" fill="#8E55B0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">RED NEUROVEGETATIVA &amp; PIEL</text>
      <text x="34" y="40" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Capa: Ectodermo somatosensorial</text>
      <text x="34" y="54" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="9.5">Conflicto: Separación afectiva, contacto no deseado</text>
      <text x="34" y="68" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="8.5">Patologías: Ansiedad, insomnio, dermatitis</text>
    </g>
  </g>

  <!-- LÍNEAS CONDUCTORAS DE INERVACIÓN (MÉDULA -> ÓRGANOS DIANA) -->
  <g id="nerve-conduits">
    <!-- Hacia Respiratorio (T2-T4) -->
    <path d="M 445 235 C 465 235, 480 185, 500 185" fill="none" stroke="#2B74AA" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-cyan)"/>
    <!-- Hacia Digestivo (T5-T9) -->
    <path d="M 445 285 C 465 285, 480 275, 500 275" fill="none" stroke="#2E854B" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-green)"/>
    <!-- Hacia Osteoarticular (L1-L5) -->
    <path d="M 445 365 C 465 365, 480 365, 500 365" fill="none" stroke="#C25E3E" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-terracotta)"/>
    <!-- Hacia Nervioso / Cutáneo (Cervical / Sacro) -->
    <path d="M 445 440 C 470 440, 480 455, 500 455" fill="none" stroke="#7C4499" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-lavender)"/>
  </g>

  <!-- PIE DE FIGURA: LEYENDA CLÍNICA Y CERTIFICACIÓN METODOLÓGICA -->
  <g id="footer-legend" transform="translate(40, 545)">
    <rect x="0" y="0" width="720" height="38" rx="6" fill="#0E172F" stroke="#1E293B" stroke-width="1"/>
    
    <circle cx="20" cy="19" r="5" fill="#2E854B"/>
    <text x="32" y="23" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500">Digestivo</text>

    <circle cx="105" cy="19" r="5" fill="#C25E3E"/>
    <text x="117" y="23" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500">Osteoarticular</text>

    <circle cx="215" cy="19" r="5" fill="#2B74AA"/>
    <text x="227" y="23" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500">Respiratorio</text>

    <circle cx="320" cy="19" r="5" fill="#7C4499"/>
    <text x="332" y="23" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500">Nervioso / Psicosomático</text>

    <text x="705" y="23" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="end">Alma Holística © • Modelo Bioenergético Integrativo</text>
  </g>
</svg>
